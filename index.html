<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Учебник</title>
  
  <!-- Используем стабильную CDN-версию A-Frame -->
  <script src="./aframe-v1.8.0.min.js"></script>
  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  
  <style>
    body { margin: 0; overflow: hidden; }
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #fff; font-family: sans-serif; font-size: 18px;
      z-index: 999;
    }
  </style>
</head>
<body>
  <div id="loading">Загрузка AR...<br>Разрешите доступ к камере</div>

  <!-- ИСПРАВЛЕНО: убраны пробелы в имени файла targets.mind -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets (2).mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Убедитесь, что этот файл лежит в той же папке -->
      <a-asset-item id="model" src="./geometry_dash_checkpoints.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        rotation="0 0 0"
        position="0 0 0.1"
        scale="0.1 0.1 0.1"
        src="#model"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 20000">
      </a-gltf-model>
    </a-entity>
  </a-scene>

  <script>
    // Скрываем экран загрузки, когда сцена полностью инициализирована
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
      document.getElementById('loading').style.display = 'none';
    });
    
    // Дополнительная обработка ошибок загрузки
    scene.addEventListener('mindar-error', (event) => {
      console.error("Ошибка MindAR:", event);
      document.getElementById('loading').innerHTML = "Ошибка загрузки AR. Проверьте консоль (F12).";
    });
  </script>
</body>
</html>
