<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>AR Проекции</title>

  <!-- Если с 1.8.0 будет чёрный экран — замените на https://aframe.io/releases/1.5.0/aframe.min.js -->
  <script src="./aframe-v1.8.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
    #loading {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;
      background: #fff; font-size: 18px;
    }
    #hint {
      position: fixed; top: 16px; left: 16px; right: 16px; z-index: 1000;
      background: #000b; color: #fff; padding: 10px 14px; border-radius: 10px; text-align: center; font-size: 15px;
    }
    #panel {
      position: fixed; left: 8px; right: 8px; bottom: 12px; z-index: 1000;
      display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .row button {
      border: 0; border-radius: 999px; padding: 9px 14px; font-size: 14px;
      background: #ffffffe6; color: #222; box-shadow: 0 1px 4px #0004;
    }
    .row button.on { background: #2b6cff; color: #fff; }
  </style>
</head>
<body>
  <div id="loading">Загрузка AR...<br>Разрешите доступ к камере</div>
  <div id="hint" class="ui">Наведите камеру на страницу учебника</div>

  <div id="panel" class="ui">
    <div class="row" id="shapes">
      <button data-shape="cube" class="on">Куб</button>
      <button data-shape="prism">Призма</button>
      <button data-shape="pyramid">Пирамида</button>
      <button data-shape="cylinder">Цилиндр</button>
      <button data-shape="cone">Конус</button>
      <button data-shape="octahedron">Октаэдр</button>
    </div>
    <div class="row">
      <button id="tHidden" class="on">Невидимые линии</button>
      <button id="tRays" class="on">Лучи</button>
      <button id="tFill" class="on">Заливка</button>
      <button id="reset">Сброс</button>
    </div>
  </div>

  <script>
  const T = AFRAME.THREE;

  /* ---------- Фигуры. Ось фигуры направлена по Z — «вверх» от страницы ---------- */
  const SHAPES = {
    cube:       () => new T.BoxGeometry(0.32, 0.32, 0.32),
    prism:      () => new T.CylinderGeometry(0.2, 0.2, 0.36, 6).rotateX(Math.PI / 2),
    pyramid:    () => new T.ConeGeometry(0.24, 0.36, 4).rotateY(Math.PI / 4).rotateX(Math.PI / 2),
    cylinder:   () => new T.CylinderGeometry(0.18, 0.18, 0.36, 32).rotateX(Math.PI / 2),
    cone:       () => new T.ConeGeometry(0.2, 0.38, 32).rotateX(Math.PI / 2),
    octahedron: () => new T.OctahedronGeometry(0.24),
  };

  AFRAME.registerComponent('solid-shape', {
    schema: { type: { default: 'cube' } },
    update() {
      const g = SHAPES[this.data.type]();
      const group = new T.Group();
      group.add(new T.Mesh(g, new T.MeshStandardMaterial({
        color: '#4c8dff', transparent: true, opacity: 0.8, roughness: 0.6, metalness: 0
      })));
      group.add(new T.LineSegments(new T.EdgesGeometry(g, 20), new T.LineBasicMaterial({ color: '#0b1a3a' })));
      this.el.setObject3D('mesh', group);
      this.el.emit('shape-changed');
    }
  });

  /* ---------- Вращение пальцем (1 палец) и масштаб щипком (2 пальца) ---------- */
  AFRAME.registerComponent('touch-rotate', {
    schema: {
      speed: { default: 0.01 },
      initial: { type: 'vec3', default: { x: -35, y: 0, z: 25 } } // начальный наклон, градусы
    },
    init() {
      const o = this.el.object3D, d = T.MathUtils.degToRad;
      const X = new T.Vector3(1, 0, 0), Z = new T.Vector3(0, 0, 1);
      const qx = new T.Quaternion(), qz = new T.Quaternion();

      this.reset = () => {
        const i = this.data.initial;
        o.quaternion.setFromEuler(new T.Euler(d(i.x), d(i.y), d(i.z)));
        o.scale.setScalar(1);
      };
      this.reset();

      // горизонтальный жест — вращение вокруг вертикали (как на гончарном круге),
      // вертикальный — наклон фигуры к странице / от неё
      const rotate = (dx, dy) => {
        qz.setFromAxisAngle(Z, dx * this.data.speed);
        qx.setFromAxisAngle(X, dy * this.data.speed);
        o.quaternion.premultiply(qz).premultiply(qx);
      };
      const onUI = e => e.target.closest && e.target.closest('.ui');
      const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

      let last = null, pinch0 = 0, scale0 = 1;
      document.addEventListener('touchstart', e => {
        if (onUI(e)) return;
        if (e.touches.length === 1) last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.touches.length === 2) { pinch0 = dist(e.touches); scale0 = o.scale.x; last = null; }
      }, { passive: true });
      document.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && last) {
          const t = e.touches[0];
          rotate(t.clientX - last.x, t.clientY - last.y);
          last = { x: t.clientX, y: t.clientY };
        } else if (e.touches.length === 2 && pinch0) {
          o.scale.setScalar(T.MathUtils.clamp(scale0 * dist(e.touches) / pinch0, 0.4, 1.8));
        }
      }, { passive: true });
      document.addEventListener('touchend', e => { if (!e.touches.length) { last = null; pinch0 = 0; } });

      // мышь — для проверки на компьютере
      let down = null;
      document.addEventListener('mousedown', e => { if (!onUI(e)) down = { x: e.clientX, y: e.clientY }; });
      document.addEventListener('mousemove', e => {
        if (!down) return;
        rotate(e.clientX - down.x, e.clientY - down.y);
        down = { x: e.clientX, y: e.clientY };
      });
      document.addEventListener('mouseup', () => down = null);
    }
  });

  /* ---------- Топология: вершины, треугольники, рёбра со смежными гранями ---------- */
  function buildTopology(geoms) {
    const keyMap = new Map(), verts = [], tris = [], normals = [];
    const ab = new T.Vector3(), ac = new T.Vector3();

    for (const geom of geoms) {
      const pos = geom.attributes.position;
      const remap = new Int32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const k = Math.round(x * 1e4) + '_' + Math.round(y * 1e4) + '_' + Math.round(z * 1e4);
        let id = keyMap.get(k);
        if (id === undefined) { id = verts.length; keyMap.set(k, id); verts.push(new T.Vector3(x, y, z)); }
        remap[i] = id; // склеиваем совпадающие вершины (швы, полюса)
      }
      const idx = geom.index ? geom.index.array : Array.from({ length: pos.count }, (_, i) => i);
      for (let i = 0; i < idx.length; i += 3) {
        const a = remap[idx[i]], b = remap[idx[i + 1]], c = remap[idx[i + 2]];
        if (a === b || b === c || a === c) continue; // вырожденные треугольники
        ab.subVectors(verts[b], verts[a]); ac.subVectors(verts[c], verts[a]);
        const n = new T.Vector3().crossVectors(ab, ac);
        if (n.lengthSq() < 1e-12) continue;
        tris.push([a, b, c]); normals.push(n.normalize());
      }
    }

    const edgeMap = new Map();
    tris.forEach((t, f) => {
      for (let j = 0; j < 3; j++) {
        const a = Math.min(t[j], t[(j + 1) % 3]), b = Math.max(t[j], t[(j + 1) % 3]);
        const k = a + '_' + b;
        let e = edgeMap.get(k);
        if (!e) edgeMap.set(k, e = { a, b, faces: [] });
        e.faces.push(f);
      }
    });

    // «Настоящее» ребро — где грани сходятся под углом > 20°.
    // Рёбра внутри плоской грани и на гладкой боковой поверхности цилиндра не рисуем.
    const cosT = Math.cos(T.MathUtils.degToRad(20));
    const edges = [...edgeMap.values()];
    for (const e of edges) {
      e.feature = e.faces.length !== 2 || normals[e.faces[0]].dot(normals[e.faces[1]]) < cosT;
    }
    return { verts, tris, edges };
  }

  // Матрица объекта относительно root (без мировых координат — они у MindAR меняются)
  function relMatrix(obj, root) {
    const chain = [];
    for (let o = obj; o && o !== root; o = o.parent) { o.updateMatrix(); chain.push(o); }
    const m = new T.Matrix4();
    for (let i = chain.length - 1; i >= 0; i--) m.multiply(chain[i].matrix);
    return m;
  }

  // Выпуклая оболочка точек на плоскости (для заливки контура)
  function convexHull(pts) {
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    for (const p of pts) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
      lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
      upper.push(p);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  /* ---------- Толстые линии на плоскости страницы (WebGL-линии на телефоне всегда в 1 px) ---------- */
  function pushQuad(arr, n, max, ax, ay, bx, by, w, z) {
    let dx = bx - ax, dy = by - ay;
    const L = Math.hypot(dx, dy);
    if (L < 1e-6 || n + 6 > max) return n;
    dx /= L; dy /= L;
    const h = w / 2, px = -dy * h, py = dx * h;
    ax -= dx * h; ay -= dy * h; bx += dx * h; by += dy * h; // квадратные концы — без щелей в углах
    const v = [ax + px, ay + py, ax - px, ay - py, bx + px, by + py,
               bx + px, by + py, ax - px, ay - py, bx - px, by - py];
    for (let i = 0; i < 6; i++) { arr[n * 3] = v[i * 2]; arr[n * 3 + 1] = v[i * 2 + 1]; arr[n * 3 + 2] = z; n++; }
    return n;
  }
  function pushDashed(arr, n, max, ax, ay, bx, by, w, z, dash, gap) {
    const L = Math.hypot(bx - ax, by - ay);
    if (L < 1e-6) return n;
    const ux = (bx - ax) / L, uy = (by - ay) / L;
    for (let s = 0; s < L; s += dash + gap) {
      const e = Math.min(s + dash, L);
      n = pushQuad(arr, n, max, ax + ux * s, ay + uy * s, ax + ux * e, ay + uy * e, w, z);
    }
    return n;
  }

  /* ---------- Проекция фигуры на плоскость страницы (z = 0) ---------- */
  AFRAME.registerComponent('solid-projection', {
    schema: {
      source: { type: 'selector' },
      hidden: { default: true },   // невидимые рёбра штрихами
      rays:   { default: true },   // проецирующие лучи от вершин
      fill:   { default: true },   // заливка контура (верно для выпуклых фигур)
      color:  { default: '#d7263d' },
      width:  { default: 0.008 }   // толщина линии; ширина метки = 1
    },
    init() {
      const MAXV = 60000;
      const lineMat = new T.MeshBasicMaterial({ color: this.data.color, side: T.DoubleSide });
      this.vis  = this.makeBuffer(MAXV, lineMat, false);
      this.hid  = this.makeBuffer(MAXV, lineMat, false);
      this.fillB = this.makeBuffer(3000, new T.MeshBasicMaterial({
        color: this.data.color, transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide
      }), false);
      this.rayB = this.makeBuffer(20000, new T.LineBasicMaterial({
        color: '#2b6cff', transparent: true, opacity: 0.55
      }), true);

      this.rebuild = this.rebuild.bind(this);
      this.data.source.addEventListener('shape-changed', this.rebuild);
      this.data.source.addEventListener('model-loaded', this.rebuild); // для .glb
    },
    makeBuffer(maxVerts, material, isLines) {
      const arr = new Float32Array(maxVerts * 3);
      const g = new T.BufferGeometry();
      const attr = new T.BufferAttribute(arr, 3);
      attr.setUsage(T.DynamicDrawUsage);
      g.setAttribute('position', attr);
      g.setDrawRange(0, 0);
      const obj = isLines ? new T.LineSegments(g, material) : new T.Mesh(g, material);
      obj.frustumCulled = false;
      this.el.object3D.add(obj);
      return { arr, attr, g, obj, max: maxVerts };
    },
    commit(b, n) { b.attr.needsUpdate = true; b.g.setDrawRange(0, n); },

    rebuild() {
      const src = this.data.source.object3D;
      const geoms = [];
      src.traverse(o => {
        if (o.isMesh && o.geometry && o.geometry.attributes.position) {
          geoms.push(o.geometry.clone().applyMatrix4(relMatrix(o, src)));
        }
      });
      this.topo = geoms.length ? buildTopology(geoms) : null;
      if (!this.topo) return;
      this.wv = this.topo.verts.map(() => new T.Vector3());
      this.front = new Uint8Array(this.topo.tris.length);
      this.used = new Uint8Array(this.topo.verts.length);
    },

    tick() {
      if (!this.topo) { this.rebuild(); if (!this.topo) return; }
      const d = this.data, W = d.width;
      const src = d.source.object3D;
      src.updateMatrix();
      const M = src.matrix; // положение фигуры относительно метки
      const { verts, tris, edges } = this.topo;
      const wv = this.wv, front = this.front, used = this.used;

      for (let i = 0; i < verts.length; i++) wv[i].copy(verts[i]).applyMatrix4(M);

      // Грань «видна сверху», если её нормаль смотрит от страницы (z > 0)
      for (let f = 0; f < tris.length; f++) {
        const A = wv[tris[f][0]], B = wv[tris[f][1]], C = wv[tris[f][2]];
        front[f] = ((B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x)) > 1e-9 ? 1 : 0;
      }

      let nv = 0, nh = 0;
      used.fill(0);
      for (const e of edges) {
        let draw = false, visible = false;
        if (e.faces.length === 2) {
          const f0 = front[e.faces[0]], f1 = front[e.faces[1]];
          if (f0 !== f1) { draw = true; visible = true; }      // очерковая линия (контур)
          else if (e.feature) { draw = true; visible = !!f0; } // ребро между двумя гранями
        } else {
          draw = true; visible = e.faces.some(f => front[f]);
        }
        if (!draw) continue;
        const A = wv[e.a], B = wv[e.b];
        if (visible) nv = pushQuad(this.vis.arr, nv, this.vis.max, A.x, A.y, B.x, B.y, W, 0.003);
        else if (d.hidden) nh = pushDashed(this.hid.arr, nh, this.hid.max, A.x, A.y, B.x, B.y, W * 0.7, 0.002, 0.025, 0.018);
        used[e.a] = used[e.b] = 1;
      }
      this.commit(this.vis, nv);
      this.commit(this.hid, nh);

      // Заливка проекции
      let nf = 0;
      if (d.fill) {
        const hull = convexHull(wv.map(v => [v.x, v.y]));
        const a = this.fillB.arr;
        for (let i = 1; i < hull.length - 1 && nf + 3 <= this.fillB.max; i++) {
          for (const p of [hull[0], hull[i], hull[i + 1]]) {
            a[nf * 3] = p[0]; a[nf * 3 + 1] = p[1]; a[nf * 3 + 2] = 0.001; nf++;
          }
        }
      }
      this.commit(this.fillB, nf);

      // Проецирующие лучи: от вершины фигуры вниз, к её проекции
      let nr = 0;
      if (d.rays) {
        const a = this.rayB.arr;
        for (let i = 0; i < wv.length && nr + 2 <= this.rayB.max; i++) {
          if (!used[i]) continue;
          const v = wv[i];
          a[nr * 3] = v.x; a[nr * 3 + 1] = v.y; a[nr * 3 + 2] = v.z; nr++;
          a[nr * 3] = v.x; a[nr * 3 + 1] = v.y; a[nr * 3 + 2] = 0.003; nr++;
        }
      }
      this.commit(this.rayB, nr);
    },

    remove() {
      this.data.source.removeEventListener('shape-changed', this.rebuild);
      this.data.source.removeEventListener('model-loaded', this.rebuild);
    }
  });
  </script>

  <!--
    filterMinCF / filterBeta — сглаживание дрожания: учебник лежит на столе,
    поэтому можно сглаживать сильнее обычного.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets (1).mind; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0.5 1 1"></a-entity>

    <!--
      Система координат метки: X — вправо по странице, Y — вверх по странице,
      Z — перпендикулярно странице к камере. Ширина картинки-метки = 1.
      Центр проекции совпадает с центром картинки.
    -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="solid" position="0 0 0.5" solid-shape="type: cube" touch-rotate></a-entity>
      <a-entity id="proj" solid-projection="source: #solid"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene');
    const loading = document.getElementById('loading');
    const hint = document.getElementById('hint');
    const solid = document.getElementById('solid');
    const proj = document.getElementById('proj');

    scene.addEventListener('arReady', () => loading.style.display = 'none');
    scene.addEventListener('arError', e => {
      console.error('Ошибка MindAR:', e);
      loading.style.display = 'flex';
      loading.innerHTML = 'Не удалось запустить AR.<br>Откройте страницу по https и разрешите доступ к камере.';
    });

    const target = document.getElementById('target0');
    target.addEventListener('targetFound', () => hint.style.display = 'none');
    target.addEventListener('targetLost', () => hint.style.display = 'block');

    // Выбор фигуры
    document.querySelectorAll('#shapes button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#shapes button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        solid.setAttribute('solid-shape', 'type', btn.dataset.shape);
      });
    });

    // Переключатели
    const toggle = (id, prop) => {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        const on = !btn.classList.contains('on');
        btn.classList.toggle('on', on);
        proj.setAttribute('solid-projection', prop, on);
      });
    };
    toggle('tHidden', 'hidden');
    toggle('tRays', 'rays');
    toggle('tFill', 'fill');

    document.getElementById('reset').addEventListener('click', () => {
      solid.components['touch-rotate'].reset();
    });
  </script>
</body>
</html>
