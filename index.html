<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>AR Проекции</title>

  <!-- Если с 1.8.0 будет чёрный экран — замените на https://aframe.io/releases/1.5.0/aframe.min.js -->
  <script src="./aframe-v1.8.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body { margin: 0; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; }
    #loading {
      position: fixed; inset: 0; z-index: 2000;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px;
      background: #fff; font-size: 18px;
    }
    #hint {
      position: fixed; top: 16px; left: 16px; right: 16px; z-index: 1000;
      background: #000b; color: #fff; padding: 10px 14px; border-radius: 10px; text-align: center; font-size: 15px;
    }
    #panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000;
      padding: 8px 8px calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 6px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
    .seg {
      display: flex; gap: 2px; padding: 3px; border-radius: 999px;
      background: #ffffffe6; box-shadow: 0 1px 4px #0004;
    }
    .seg button, .chip {
      border: 0; border-radius: 999px; padding: 8px 12px; font-size: 13px; color: #222; background: transparent;
    }
    .chip { background: #ffffffe6; box-shadow: 0 1px 4px #0004; }
    .seg button.on, .chip.on { background: #2b6cff; color: #fff; }
    .chip:disabled { opacity: 0.4; }
    #mode { align-self: center; }

    #sheet {
      display: none; max-height: 48vh; overflow-y: auto; touch-action: pan-y;
      background: #fffffff2; border-radius: 14px; padding: 12px 14px; box-shadow: 0 2px 10px #0005;
    }
    #sheet.open { display: block; }
    #sheet h4 { margin: 12px 0 6px; font-size: 13px; color: #666; font-weight: 600; }
    #sheet h4:first-child { margin-top: 0; }
    #subtypes { flex-wrap: wrap; border-radius: 14px; box-shadow: none; background: #eef1f6; }
    .param { margin: 8px 0; }
    .param .pl { display: flex; justify-content: space-between; font-size: 14px; color: #222; }
    .param input { width: 100%; margin: 4px 0 0; }
    .note { font-size: 13px; color: #555; margin: 6px 0; }
  </style>
</head>
<body>
  <div id="loading">Загрузка AR...<br>Разрешите доступ к камере</div>
  <div id="hint" class="ui">Наведите камеру на страницу учебника</div>

  <div id="panel" class="ui">
    <div id="sheet">
      <h4>Вид фигуры</h4>
      <div class="seg" id="subtypes"></div>
      <h4>Размеры</h4>
      <div id="params"></div>
      <h4>Положение</h4>
      <div id="placement"></div>
      <div class="row">
        <button class="chip" id="poseFlat">Основание параллельно странице</button>
        <button class="chip" id="poseTilt">Наклонить</button>
      </div>
    </div>

    <div class="row">
      <div class="seg" id="family">
        <button data-f="par" class="on">Параллелепипед</button>
        <button data-f="pyr">Пирамида</button>
      </div>
      <button class="chip" id="tSheet">⚙ Настройки</button>
    </div>
    <div class="seg" id="mode">
      <button data-m="drawing" class="on">Чертёж</button>
      <button data-m="outline">Контур</button>
      <button data-m="shadow">Тень</button>
    </div>
    <div class="row">
      <button class="chip on" id="tHidden">Невидимые</button>
      <button class="chip on" id="tRays">Лучи</button>
      <button class="chip on" id="tFill">Заливка</button>
      <button class="chip" id="tLabels">Буквы</button>
    </div>
  </div>

  <script>
  const T = AFRAME.THREE;
  const rad = T.MathUtils.degToRad;

  /*
    Ширина напечатанной картинки-метки в сантиметрах.
    Если метка напечатана именно такой ширины, размеры фигуры в AR совпадают с реальными
    (при масштабе 100%).
  */
  const MARKER_CM = 15;
  const cm = v => v / MARKER_CM;

  /* ================== Фигуры ================== */

  const SUBTYPES = {
    par: [
      { id: 'cube',    name: 'Куб',           params: ['a'],                               labels: { a: 'Ребро' } },
      { id: 'rect',    name: 'Прямоугольный', params: ['a', 'b', 'h'] },
      { id: 'right',   name: 'Прямой',        params: ['a', 'b', 'alpha', 'h'] },
      { id: 'oblique', name: 'Наклонный',     params: ['a', 'b', 'alpha', 'h', 'beta', 'phi'] },
    ],
    pyr: [
      { id: 'regular',   name: 'Правильная',     params: ['a', 'h'],  labels: { a: 'Сторона основания' } },
      { id: 'tetra',     name: 'Тетраэдр',       params: ['a'],       labels: { a: 'Ребро' } },
      { id: 'rightEdge', name: 'SA ⊥ основанию', params: ['a', 'b', 'gamma', 'h'], labels: { h: 'Ребро SA (высота)' } },
      { id: 'free',      name: 'Произвольная',   params: ['a', 'b', 'gamma', 'h', 'dx', 'dy'] },
    ],
  };

  const LABELS = {
    par: { a: 'AB (длина)', b: 'AD (ширина)', h: 'Высота', alpha: 'Угол BAD',
           beta: 'Наклон боковых рёбер', phi: 'Направление наклона' },
    pyr: { a: 'AB', b: 'AC', gamma: 'Угол BAC', h: 'Высота SO', dx: 'Сдвиг вершины S вправо', dy: 'Сдвиг вершины S вглубь' },
  };

  const RANGES = {
    a:     { min: 1,   max: 12,  step: 0.5, unit: ' см' },
    b:     { min: 1,   max: 12,  step: 0.5, unit: ' см' },
    h:     { min: 1,   max: 15,  step: 0.5, unit: ' см' },
    alpha: { min: 30,  max: 150, step: 1,   unit: '°' },
    beta:  { min: 0,   max: 60,  step: 1,   unit: '°' },
    phi:   { min: 0,   max: 355, step: 5,   unit: '°' },
    gamma: { min: 20,  max: 150, step: 1,   unit: '°' },
    dx:    { min: -6,  max: 6,   step: 0.5, unit: ' см' },
    dy:    { min: -6,  max: 6,   step: 0.5, unit: ' см' },
  };

  /*
    Строит фигуру по параметрам (в см и градусах).
    Основание лежит в плоскости XY (параллельно странице), высота — по Z.
    Возвращает геометрию, вершины и их имена.
  */
  function buildSolid(family, sub, p) {
    let V, F, names;
    const add = (...vs) => vs.reduce((s, x) => [s[0] + x[0], s[1] + x[1], s[2] + x[2]], [0, 0, 0]);

    if (family === 'par') {
      const a = cm(p.a);
      const b = cm(sub === 'cube' ? p.a : p.b);
      const h = cm(sub === 'cube' ? p.a : p.h);
      const al = (sub === 'right' || sub === 'oblique') ? rad(p.alpha) : Math.PI / 2;
      const u = [a, 0, 0];                                  // AB
      const v = [b * Math.cos(al), b * Math.sin(al), 0];    // AD
      let w = [0, 0, h];                                    // AA₁
      if (sub === 'oblique') {
        const t = h * Math.tan(rad(p.beta));                // высота остаётся h, ребро наклоняется
        w = [t * Math.cos(rad(p.phi)), t * Math.sin(rad(p.phi)), h];
      }
      const A = [0, 0, 0], B = u, C = add(u, v), D = v;
      V = [A, B, C, D, add(A, w), add(B, w), add(C, w), add(D, w)];
      F = [[0, 1, 2, 3], [4, 5, 6, 7], [0, 1, 5, 4], [1, 2, 6, 5], [2, 3, 7, 6], [3, 0, 4, 7]];
      names = ['A', 'B', 'C', 'D', 'A₁', 'B₁', 'C₁', 'D₁'];
    } else {
      const a = cm(p.a);
      let b, g;
      if (sub === 'regular' || sub === 'tetra') { b = a; g = Math.PI / 3; }
      else { b = cm(p.b); g = rad(p.gamma); }
      const A = [0, 0, 0], B = [a, 0, 0], C = [b * Math.cos(g), b * Math.sin(g), 0];
      const O = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];   // центр основания
      const h = sub === 'tetra' ? a * Math.sqrt(2 / 3) : cm(p.h);
      let S;
      if (sub === 'rightEdge') S = [0, 0, h];                           // вершина над A
      else if (sub === 'free') S = [O[0] + cm(p.dx), O[1] + cm(p.dy), h];
      else S = [O[0], O[1], h];                                         // над центром
      V = [A, B, C, S];
      F = [[0, 1, 2], [0, 1, 3], [1, 2, 3], [2, 0, 3]];
      names = ['A', 'B', 'C', 'S'];
    }

    // центрируем по габаритам — вокруг этой точки фигура вращается
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    V.forEach(q => q.forEach((c, i) => { mn[i] = Math.min(mn[i], c); mx[i] = Math.max(mx[i], c); }));
    const ctr = mn.map((m, i) => (m + mx[i]) / 2);
    const verts = V.map(q => new T.Vector3(q[0] - ctr[0], q[1] - ctr[1], q[2] - ctr[2]));

    // грани → треугольники, все нормали наружу
    const centroid = verts.reduce((s, q) => s.add(q), new T.Vector3()).divideScalar(verts.length);
    const pos = [];
    const e1 = new T.Vector3(), e2 = new T.Vector3(), n = new T.Vector3(), fc = new T.Vector3();
    for (const face of F) {
      fc.set(0, 0, 0);
      face.forEach(i => fc.add(verts[i]));
      fc.divideScalar(face.length);
      for (let k = 1; k < face.length - 1; k++) {
        let tri = [face[0], face[k], face[k + 1]];
        e1.subVectors(verts[tri[1]], verts[tri[0]]);
        e2.subVectors(verts[tri[2]], verts[tri[0]]);
        n.crossVectors(e1, e2);
        if (n.dot(fc.clone().sub(centroid)) < 0) tri = [tri[0], tri[2], tri[1]];
        tri.forEach(i => pos.push(verts[i].x, verts[i].y, verts[i].z));
      }
    }
    const geometry = new T.BufferGeometry();
    geometry.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    geometry.computeVertexNormals();
    return { geometry, verts, names };
  }

  /* ================== Подписи вершин ================== */

  function makeLabel(text, color) {
    const c = document.createElement('canvas');
    let ctx = c.getContext('2d');
    const fs = 56;
    ctx.font = `bold ${fs}px sans-serif`;
    c.width = Math.ceil(ctx.measureText(text).width) + 20;
    c.height = fs + 20;
    ctx = c.getContext('2d');
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 10; ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
    ctx.strokeText(text, 10, c.height / 2);
    ctx.fillStyle = color;
    ctx.fillText(text, 10, c.height / 2);
    const tex = new T.CanvasTexture(c);
    if (T.SRGBColorSpace) tex.colorSpace = T.SRGBColorSpace;
    const s = new T.Sprite(new T.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    const H = 0.045;
    s.scale.set(H * c.width / c.height, H, 1);
    s.renderOrder = 10;
    return s;
  }

  /* ================== Компонент: сама фигура ================== */

  AFRAME.registerComponent('solid-shape', {
    set(solid, labelsOn) {
      const group = new T.Group();
      group.add(new T.Mesh(solid.geometry, new T.MeshStandardMaterial({
        color: '#4c8dff', transparent: true, opacity: 0.8, roughness: 0.6, metalness: 0, flatShading: true
      })));
      group.add(new T.LineSegments(new T.EdgesGeometry(solid.geometry, 1),
                                   new T.LineBasicMaterial({ color: '#0b1a3a' })));

      // буквы у вершин, чуть вынесены наружу
      const lg = new T.Group();
      const c = solid.verts.reduce((s, q) => s.add(q), new T.Vector3()).divideScalar(solid.verts.length);
      solid.verts.forEach((v, i) => {
        const s = makeLabel(solid.names[i], '#0b1a3a');
        s.position.copy(v).add(v.clone().sub(c).normalize().multiplyScalar(0.035));
        lg.add(s);
      });
      lg.visible = labelsOn;
      group.add(lg);

      const old = this.el.getObject3D('mesh');
      if (old) old.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      });

      this.labelGroup = lg;
      this.verts = solid.verts;
      this.names = solid.names;
      this.el.setObject3D('mesh', group);
      this.el.emit('shape-changed');
    },
    showLabels(on) { if (this.labelGroup) this.labelGroup.visible = on; }
  });

  /* ================== Вращение пальцем, масштаб щипком ================== */

  AFRAME.registerComponent('touch-rotate', {
    schema: { speed: { default: 0.01 } },
    init() {
      const o = this.el.object3D;
      const X = new T.Vector3(1, 0, 0), Z = new T.Vector3(0, 0, 1);
      const qx = new T.Quaternion(), qz = new T.Quaternion();

      this.setPose = (x, y, z) => o.quaternion.setFromEuler(new T.Euler(rad(x), rad(y), rad(z)));

      // горизонтальный жест — поворот вокруг вертикали, вертикальный — наклон к странице
      const rotate = (dx, dy) => {
        qz.setFromAxisAngle(Z, dx * this.data.speed);
        qx.setFromAxisAngle(X, dy * this.data.speed);
        o.quaternion.premultiply(qz).premultiply(qx);
      };
      const onUI = e => e.target.closest && e.target.closest('.ui');
      const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);

      let last = null, pinch0 = 0, scale0 = 1;
      document.addEventListener('touchstart', e => {
        if (onUI(e)) return;
        if (e.touches.length === 1) last = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        if (e.touches.length === 2) { pinch0 = dist(e.touches); scale0 = o.scale.x; last = null; }
      }, { passive: true });
      document.addEventListener('touchmove', e => {
        if (e.touches.length === 1 && last) {
          const t = e.touches[0];
          rotate(t.clientX - last.x, t.clientY - last.y);
          last = { x: t.clientX, y: t.clientY };
        } else if (e.touches.length === 2 && pinch0) {
          const s = T.MathUtils.clamp(scale0 * dist(e.touches) / pinch0, 0.3, 2.5);
          this.el.emit('pinch-scale', { scale: s });
        }
      }, { passive: true });
      document.addEventListener('touchend', e => { if (!e.touches.length) { last = null; pinch0 = 0; } });

      let down = null; // мышь — для проверки на компьютере
      document.addEventListener('mousedown', e => { if (!onUI(e)) down = { x: e.clientX, y: e.clientY }; });
      document.addEventListener('mousemove', e => {
        if (!down) return;
        rotate(e.clientX - down.x, e.clientY - down.y);
        down = { x: e.clientX, y: e.clientY };
      });
      document.addEventListener('mouseup', () => down = null);
    }
  });

  /* ================== Геометрия проекции ================== */

  function buildTopology(geoms) {
    const keyMap = new Map(), verts = [], tris = [], normals = [];
    const ab = new T.Vector3(), ac = new T.Vector3();
    for (const geom of geoms) {
      const pos = geom.attributes.position;
      const remap = new Int32Array(pos.count);
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const k = Math.round(x * 1e4) + '_' + Math.round(y * 1e4) + '_' + Math.round(z * 1e4);
        let id = keyMap.get(k);
        if (id === undefined) { id = verts.length; keyMap.set(k, id); verts.push(new T.Vector3(x, y, z)); }
        remap[i] = id;
      }
      const idx = geom.index ? geom.index.array : Array.from({ length: pos.count }, (_, i) => i);
      for (let i = 0; i < idx.length; i += 3) {
        const a = remap[idx[i]], b = remap[idx[i + 1]], c = remap[idx[i + 2]];
        if (a === b || b === c || a === c) continue;
        ab.subVectors(verts[b], verts[a]); ac.subVectors(verts[c], verts[a]);
        const n = new T.Vector3().crossVectors(ab, ac);
        if (n.lengthSq() < 1e-12) continue;
        tris.push([a, b, c]); normals.push(n.normalize());
      }
    }
    const edgeMap = new Map();
    tris.forEach((t, f) => {
      for (let j = 0; j < 3; j++) {
        const a = Math.min(t[j], t[(j + 1) % 3]), b = Math.max(t[j], t[(j + 1) % 3]);
        const k = a + '_' + b;
        let e = edgeMap.get(k);
        if (!e) edgeMap.set(k, e = { a, b, faces: [] });
        e.faces.push(f);
      }
    });
    // ребро — где грани сходятся под углом; диагонали внутри плоских граней не рисуем
    const cosT = Math.cos(rad(20));
    const edges = [...edgeMap.values()];
    for (const e of edges) {
      e.feature = e.faces.length !== 2 || normals[e.faces[0]].dot(normals[e.faces[1]]) < cosT;
    }
    return { verts, tris, edges };
  }

  function relMatrix(obj, root) {
    const chain = [];
    for (let o = obj; o && o !== root; o = o.parent) { o.updateMatrix(); chain.push(o); }
    const m = new T.Matrix4();
    for (let i = chain.length - 1; i >= 0; i--) m.multiply(chain[i].matrix);
    return m;
  }

  function convexHull(pts) {
    pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    for (const p of pts) {
      while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 1e-12) lower.pop();
      lower.push(p);
    }
    for (let i = pts.length - 1; i >= 0; i--) {
      const p = pts[i];
      while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 1e-12) upper.pop();
      upper.push(p);
    }
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  function pushQuad(arr, n, max, ax, ay, bx, by, w, z) {
    let dx = bx - ax, dy = by - ay;
    const L = Math.hypot(dx, dy);
    if (L < 1e-6 || n + 6 > max) return n;
    dx /= L; dy /= L;
    const h = w / 2, px = -dy * h, py = dx * h;
    ax -= dx * h; ay -= dy * h; bx += dx * h; by += dy * h;
    const v = [ax + px, ay + py, ax - px, ay - py, bx + px, by + py,
               bx + px, by + py, ax - px, ay - py, bx - px, by - py];
    for (let i = 0; i < 6; i++) { arr[n * 3] = v[i * 2]; arr[n * 3 + 1] = v[i * 2 + 1]; arr[n * 3 + 2] = z; n++; }
    return n;
  }
  function pushDashed(arr, n, max, ax, ay, bx, by, w, z, dash, gap) {
    const L = Math.hypot(bx - ax, by - ay);
    if (L < 1e-6) return n;
    const ux = (bx - ax) / L, uy = (by - ay) / L;
    for (let s = 0; s < L; s += dash + gap) {
      const e = Math.min(s + dash, L);
      n = pushQuad(arr, n, max, ax + ux * s, ay + uy * s, ax + ux * e, ay + uy * e, w, z);
    }
    return n;
  }
  function pushFan(buf, hull, z) {
    let n = 0;
    const a = buf.arr;
    for (let i = 1; i < hull.length - 1 && n + 3 <= buf.max; i++) {
      for (const p of [hull[0], hull[i], hull[i + 1]]) {
        a[n * 3] = p[0]; a[n * 3 + 1] = p[1]; a[n * 3 + 2] = z; n++;
      }
    }
    return n;
  }

  /* ================== Компонент: проекция на страницу ================== */
  /*
    Режимы:
      drawing — чертёж: видимые рёбра сплошной, невидимые штрихом
      outline — только внешний контур проекции
      shadow  — сплошная заливка, как тень: рёбер и граней не различить
  */
  AFRAME.registerComponent('solid-projection', {
    schema: {
      source: { type: 'selector' },
      mode:   { default: 'drawing', oneOf: ['drawing', 'outline', 'shadow'] },
      hidden: { default: true },
      rays:   { default: true },
      fill:   { default: true },
      labels: { default: false },
      color:  { default: '#d7263d' },
      width:  { default: 0.008 }
    },
    init() {
      const lineMat = new T.MeshBasicMaterial({ color: this.data.color, side: T.DoubleSide });
      this.vis = this.makeBuffer(30000, lineMat, false);
      this.hid = this.makeBuffer(30000, lineMat, false);
      this.fillB = this.makeBuffer(600, new T.MeshBasicMaterial({
        color: this.data.color, transparent: true, opacity: 0.18, depthWrite: false, side: T.DoubleSide
      }), false);
      this.shadowB = this.makeBuffer(600, new T.MeshBasicMaterial({
        color: '#1e1e28', transparent: true, opacity: 0.82, depthWrite: false, side: T.DoubleSide
      }), false);
      this.rayB = this.makeBuffer(200, new T.LineBasicMaterial({
        color: '#2b6cff', transparent: true, opacity: 0.6
      }), true);
      this.labelPool = {};

      this.rebuild = this.rebuild.bind(this);
      this.data.source.addEventListener('shape-changed', this.rebuild);
    },
    makeBuffer(maxVerts, material, isLines) {
      const arr = new Float32Array(maxVerts * 3);
      const g = new T.BufferGeometry();
      const attr = new T.BufferAttribute(arr, 3);
      attr.setUsage(T.DynamicDrawUsage);
      g.setAttribute('position', attr);
      g.setDrawRange(0, 0);
      const obj = isLines ? new T.LineSegments(g, material) : new T.Mesh(g, material);
      obj.frustumCulled = false;
      this.el.object3D.add(obj);
      return { arr, attr, g, obj, max: maxVerts };
    },
    commit(b, n) { b.attr.needsUpdate = true; b.g.setDrawRange(0, n); },
    label(text) {
      if (!this.labelPool[text]) {
        const s = makeLabel(text, this.data.color);
        this.el.object3D.add(s);
        this.labelPool[text] = s;
      }
      return this.labelPool[text];
    },

    rebuild() {
      const src = this.data.source.object3D;
      const geoms = [];
      src.traverse(o => {
        if (o.isMesh && o.geometry && o.geometry.attributes.position) {
          geoms.push(o.geometry.clone().applyMatrix4(relMatrix(o, src)));
        }
      });
      this.topo = geoms.length ? buildTopology(geoms) : null;
      if (!this.topo) return;
      this.wv = this.topo.verts.map(() => new T.Vector3());
      this.front = new Uint8Array(this.topo.tris.length);
    },

    tick() {
      if (!this.topo) { this.rebuild(); if (!this.topo) return; }
      const d = this.data, W = d.width;
      const src = d.source.object3D;
      src.updateMatrix();
      const M = src.matrix;
      const { verts, tris, edges } = this.topo;
      const wv = this.wv, front = this.front;

      for (let i = 0; i < verts.length; i++) wv[i].copy(verts[i]).applyMatrix4(M);
      const hull = convexHull(wv.map(v => [v.x, v.y]));

      let nv = 0, nh = 0;
      if (d.mode === 'drawing') {
        for (let f = 0; f < tris.length; f++) {
          const A = wv[tris[f][0]], B = wv[tris[f][1]], C = wv[tris[f][2]];
          front[f] = ((B.x - A.x) * (C.y - A.y) - (B.y - A.y) * (C.x - A.x)) > 1e-9 ? 1 : 0;
        }
        for (const e of edges) {
          let draw = false, visible = false;
          if (e.faces.length === 2) {
            const f0 = front[e.faces[0]], f1 = front[e.faces[1]];
            if (f0 !== f1) { draw = true; visible = true; }
            else if (e.feature) { draw = true; visible = !!f0; }
          } else { draw = true; visible = e.faces.some(f => front[f]); }
          if (!draw) continue;
          const A = wv[e.a], B = wv[e.b];
          if (visible) nv = pushQuad(this.vis.arr, nv, this.vis.max, A.x, A.y, B.x, B.y, W, 0.003);
          else if (d.hidden) nh = pushDashed(this.hid.arr, nh, this.hid.max, A.x, A.y, B.x, B.y, W * 0.7, 0.002, 0.025, 0.018);
        }
      } else if (d.mode === 'outline') {
        for (let i = 0; i < hull.length; i++) {
          const p = hull[i], q = hull[(i + 1) % hull.length];
          nv = pushQuad(this.vis.arr, nv, this.vis.max, p[0], p[1], q[0], q[1], W, 0.003);
        }
      }
      this.commit(this.vis, nv);
      this.commit(this.hid, nh);
      this.commit(this.fillB, (d.mode !== 'shadow' && d.fill) ? pushFan(this.fillB, hull, 0.001) : 0);
      this.commit(this.shadowB, d.mode === 'shadow' ? pushFan(this.shadowB, hull, 0.001) : 0);

      // проецирующие лучи от каждой вершины вниз, на страницу
      let nr = 0;
      if (d.rays) {
        const a = this.rayB.arr;
        for (let i = 0; i < wv.length && nr + 2 <= this.rayB.max; i++) {
          const v = wv[i];
          a[nr * 3] = v.x; a[nr * 3 + 1] = v.y; a[nr * 3 + 2] = v.z; nr++;
          a[nr * 3] = v.x; a[nr * 3 + 1] = v.y; a[nr * 3 + 2] = 0.003; nr++;
        }
      }
      this.commit(this.rayB, nr);

      // подписи проекций вершин: A′, B′ …
      for (const k in this.labelPool) this.labelPool[k].visible = false;
      const shape = d.source.components['solid-shape'];
      if (d.labels && d.mode === 'drawing' && shape && shape.verts) {
        let cx = 0, cy = 0;
        hull.forEach(p => { cx += p[0]; cy += p[1]; });
        cx /= hull.length || 1; cy /= hull.length || 1;
        const p = new T.Vector3();
        shape.verts.forEach((v, i) => {
          p.copy(v).applyMatrix4(M);
          const dx = p.x - cx, dy = p.y - cy, L = Math.hypot(dx, dy) || 1;
          const s = this.label(shape.names[i] + '′');
          s.position.set(p.x + dx / L * 0.03, p.y + dy / L * 0.03, 0.01);
          s.visible = true;
        });
      }
    },

    remove() { this.data.source.removeEventListener('shape-changed', this.rebuild); }
  });
  </script>

  <a-scene
    mindar-image="imageTargetSrc: ./targets (1).mind; uiLoading: no; uiScanning: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.001"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="0.5 1 1"></a-entity>

    <!-- Координаты метки: X — вправо по странице, Y — вверх по странице, Z — от страницы к камере -->
    <a-entity id="target0" mindar-image-target="targetIndex: 0">
      <a-entity id="solid" solid-shape touch-rotate></a-entity>
      <a-entity id="proj" solid-projection="source: #solid"></a-entity>
    </a-entity>
  </a-scene>

  <script>
  (function () {
    const solid = document.getElementById('solid');
    const proj = document.getElementById('proj');
    const $ = id => document.getElementById(id);

    const state = {
      family: 'par',
      sub: { par: 'cube', pyr: 'regular' },
      p: { a: 5, b: 4, h: 6, alpha: 60, beta: 25, phi: 0, gamma: 60, dx: 1.5, dy: 1 },
      height: 8,     // см от страницы до центра фигуры
      scale: 100,    // %
      labels: false,
    };

    const currentSub = () => SUBTYPES[state.family].find(s => s.id === state.sub[state.family]);

    function applyShape() {
      const comp = solid.components['solid-shape'];
      if (!comp) return;
      comp.set(buildSolid(state.family, state.sub[state.family], state.p), state.labels);
      updateNote();
    }
    function applyPlacement() {
      solid.object3D.position.set(0, 0, cm(state.height));
      solid.object3D.scale.setScalar(state.scale / 100);
    }

    function slider(label, r, value, onInput) {
      const w = document.createElement('div');
      w.className = 'param';
      w.innerHTML = `<div class="pl"><span>${label}</span><b></b></div>
                     <input type="range" min="${r.min}" max="${r.max}" step="${r.step}" value="${value}">`;
      const out = w.querySelector('b'), input = w.querySelector('input');
      const show = () => out.textContent = String(+input.value).replace('.', ',') + r.unit;
      show();
      input.addEventListener('input', () => { show(); onInput(+input.value); });
      w.set = v => { input.value = v; show(); };
      return w;
    }

    function renderSubtypes() {
      const box = $('subtypes');
      box.innerHTML = '';
      SUBTYPES[state.family].forEach(s => {
        const b = document.createElement('button');
        b.textContent = s.name;
        if (s.id === state.sub[state.family]) b.classList.add('on');
        b.addEventListener('click', () => {
          state.sub[state.family] = s.id;
          renderSubtypes(); renderParams(); applyShape();
        });
        box.appendChild(b);
      });
    }

    function renderParams() {
      const box = $('params');
      box.innerHTML = '';
      const st = currentSub();
      st.params.forEach(k => {
        const label = (st.labels && st.labels[k]) || LABELS[state.family][k];
        box.appendChild(slider(label, RANGES[k], state.p[k], v => { state.p[k] = v; applyShape(); }));
      });
      const note = document.createElement('div');
      note.className = 'note'; note.id = 'note';
      box.appendChild(note);
      updateNote();
    }

    function updateNote() {
      const note = $('note');
      if (!note) return;
      const sub = state.sub[state.family];
      let t = '';
      if (state.family === 'pyr' && sub === 'tetra') {
        t = 'Все рёбра равны. Высота: h = a·√(2/3) ≈ ' + (state.p.a * Math.sqrt(2 / 3)).toFixed(1).replace('.', ',') + ' см';
      } else if (state.family === 'pyr' && sub === 'regular') {
        t = 'Основание — равносторонний треугольник, вершина S над его центром.';
      } else if (state.family === 'pyr' && sub === 'rightEdge') {
        t = 'Ребро SA перпендикулярно основанию: вершина S ровно над A.';
      } else if (state.family === 'par' && sub === 'oblique') {
        t = 'Высота — расстояние между основаниями; боковые рёбра длиннее неё.';
      }
      note.textContent = t;
      note.style.display = t ? 'block' : 'none';
    }

    // Положение: высота над страницей и масштаб
    const hSlider = slider('Расстояние до страницы', { min: 0, max: 25, step: 0.5, unit: ' см' }, state.height,
                           v => { state.height = v; applyPlacement(); });
    const sSlider = slider('Масштаб', { min: 30, max: 250, step: 5, unit: '%' }, state.scale,
                           v => { state.scale = v; applyPlacement(); });
    $('placement').append(hSlider, sSlider);

    solid.addEventListener('pinch-scale', e => {
      state.scale = Math.round(e.detail.scale * 100);
      sSlider.set(state.scale);
      applyPlacement();
    });

    // Семейство фигур
    document.querySelectorAll('#family button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#family button').forEach(b => b.classList.toggle('on', b === btn));
        state.family = btn.dataset.f;
        renderSubtypes(); renderParams(); applyShape();
      });
    });

    // Режим проекции
    function syncToggles() {
      const mode = proj.getAttribute('solid-projection').mode;
      $('tHidden').disabled = mode !== 'drawing';
      $('tFill').disabled = mode === 'shadow';
    }
    document.querySelectorAll('#mode button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#mode button').forEach(b => b.classList.toggle('on', b === btn));
        proj.setAttribute('solid-projection', 'mode', btn.dataset.m);
        syncToggles();
      });
    });

    // Переключатели
    const toggle = (id, onChange) => {
      const btn = $(id);
      btn.addEventListener('click', () => {
        const on = !btn.classList.contains('on');
        btn.classList.toggle('on', on);
        onChange(on);
      });
    };
    toggle('tHidden', on => proj.setAttribute('solid-projection', 'hidden', on));
    toggle('tRays',   on => proj.setAttribute('solid-projection', 'rays', on));
    toggle('tFill',   on => proj.setAttribute('solid-projection', 'fill', on));
    toggle('tLabels', on => {
      state.labels = on;
      solid.components['solid-shape'].showLabels(on);
      proj.setAttribute('solid-projection', 'labels', on);
    });

    $('tSheet').addEventListener('click', () => {
      $('sheet').classList.toggle('open');
      $('tSheet').classList.toggle('on');
    });

    $('poseFlat').addEventListener('click', () => solid.components['touch-rotate'].setPose(0, 0, 0));
    $('poseTilt').addEventListener('click', () => solid.components['touch-rotate'].setPose(-35, 0, 25));

    // Первый запуск — когда компоненты сцены готовы
    const start = () => {
      renderSubtypes(); renderParams(); applyPlacement(); applyShape(); syncToggles();
      solid.components['touch-rotate'].setPose(-35, 0, 25);
    };
    const scene = document.querySelector('a-scene');
    if (scene.hasLoaded) start(); else scene.addEventListener('loaded', start);

    // Подсказка «наведите камеру»
    const target = $('target0'), hint = $('hint');
    target.addEventListener('targetFound', () => hint.style.display = 'none');
    target.addEventListener('targetLost', () => hint.style.display = 'block');
  })();
  </script>

  <script>
  /* ===== Диагностика запуска: показывает по шагам, что загрузилось ===== */
  (function () {
    const scene = document.querySelector('a-scene');
    const loading = document.getElementById('loading');
    const lines = [];
    let ready = false;

    const show = (msg, ok) => {
      if (ready) return;
      lines.push((ok === true ? '✔ ' : ok === false ? '✘ ' : '… ') + msg);
      loading.innerHTML = '<div style="text-align:left;font-size:15px;line-height:1.6;max-width:420px">' +
        '<b>Запуск AR</b><br>' + lines.join('<br>') + '</div>';
    };

    // Любые ошибки скриптов — на экран (на телефоне консоль не видна)
    window.addEventListener('error', e => show('Ошибка: ' + e.message, false));
    window.addEventListener('unhandledrejection', e => {
      const r = e.reason;
      show('Ошибка: ' + (r && (r.message || r.toString()) || 'неизвестная'), false);
    });

    show('Защищённое соединение (https): ' + (window.isSecureContext ? 'да' : 'НЕТ — камера не запустится'), window.isSecureContext);
    show('A-Frame ' + (window.AFRAME ? AFRAME.version : 'не загрузился'), !!window.AFRAME);
    const mindarOk = !!(window.AFRAME && AFRAME.components['mindar-image-target']);
    show('MindAR ' + (mindarOk ? 'загрузился' : 'не загрузился (нет интернета или ошибка подключения)'), mindarOk);

    // Проверяем, что файлы реально доступны по указанным путям
    const check = async (url, name) => {
      try {
        const r = await fetch(url, { cache: 'no-store' });
        show(name + ' (' + url + '): ' + (r.ok ? 'найден' : 'ошибка ' + r.status + ' — проверьте имя файла'), r.ok);
      } catch (err) {
        show(name + ' (' + url + '): не загружается — ' + err.message, false);
      }
    };
    const raw = scene.getAttribute('mindar-image');
    const targetSrc = typeof raw === 'string'
      ? ((/imageTargetSrc:\s*([^;]+)/.exec(raw) || [])[1] || '').trim()
      : raw && raw.imageTargetSrc;
    if (targetSrc) check(targetSrc, 'Файл меток');
    document.querySelectorAll('a-asset-item').forEach(a => check(a.getAttribute('src'), 'Модель'));

    // Камера
    show('Ожидаю камеру…');
    const camTimer = setInterval(() => {
      const v = document.querySelector('video');
      if (v && v.readyState >= 2) {
        clearInterval(camTimer);
        show('Камера работает (' + v.videoWidth + '×' + v.videoHeight + ')', true);
        show('Запускаю распознавание…');
      }
    }, 300);

    scene.addEventListener('arReady', () => {
      ready = true;
      clearInterval(camTimer);
      loading.style.display = 'none';
    });
    scene.addEventListener('arError', () => show('Камера недоступна: нет разрешения или её занимает другое приложение', false));

    setTimeout(() => {
      if (!ready) show('AR не запустился за 20 секунд. Сделайте скриншот этого экрана.', false);
    }, 20000);
  })();
  </script>
</body>
